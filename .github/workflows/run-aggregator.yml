name: Job Aggregator

# NEW SKILL: GitHub Actions as a scheduler.
# This replaces cron entirely -- no VPS needed, GitHub runs this for you
# on their infrastructure, for free within generous limits.

on:
  schedule:
    # Runs every day at 08:00 UTC. Cron syntax: minute hour day month weekday
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the GitHub UI

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests first
        run: pytest tests/

      - name: Run aggregator
        env:
          JOB_KEYWORDS: "python,django,fastapi"
        run: python src/aggregator.py

      - name: Commit updated database back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db aggregator.log
          git diff --staged --quiet || git commit -m "Update job data [automated]"
          git push
